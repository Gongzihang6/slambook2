# mkdocs.yml
site_name: 视觉SLAM十四讲学习笔记
site_url: https://Gongzihang6.github.io/slambook2/
site_author: Gongzihang6

# 主题设置
theme:
    name: material
    custom_dir: overrides # 告诉 mkdocs 去这里找自定义模板
    language: zh # 中文界面
    features:
        - toc.follow    # 支持typora中的顶部[toc]目录
        - navigation.tabs # 顶部导航栏
        - navigation.sections # 侧边栏分组
        - navigation.expand # 默认展开侧边栏
        - navigation.top # 返回顶部按钮
        - search.suggest # 搜索建议
        - search.highlight # 搜索高亮
    palette:
        # 浅色模式配置
        - scheme: default
          primary: grey # 主色调
          accent: purple
          toggle:
              icon: material/weather-sunny
              name: Switch to dark mode
        # 深色模式配置
        - scheme: slate
          primary: grey
          accent: lime
          toggle:
              icon: material/weather-night
              name: Switch to light mode

# 必要的扩展 (支持数学公式和更丰富的 Markdown 语法)
markdown_extensions:
    - pymdownx.mark     # 支持markdown的==高亮
    - toc:
          permalink: true  # 可选：为标题添加锚点链接
    - admonition
    - pymdownx.details
    - pymdownx.superfences
    - pymdownx.arithmatex:
          generic: true
    - pymdownx.highlight:
          anchor_linenums: true

# 数学公式渲染引擎 (MathJax)
extra_javascript:
    - javascripts/mathjax.js
    - https://polyfill.io/v3/polyfill.min.js?features=es6
    - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# 目录结构 (你可以根据自己的笔记慢慢添加)
nav:
    - 首页: index.md
    - 学习笔记:
          - 第2讲-初识SLAM: 
                - 学习笔记/ch2初始slam/初识SLAM.md
          - 第4讲-李群与李代数:
                - 学习笔记/ch4李群与李代数/李群与李代数.md
          - 第7讲-视觉里程计1: 
                - 学习笔记/ch7视觉里程计1/视觉里程计1.md
                - 学习笔记/ch7视觉里程计1/ICP.md
                - 学习笔记/ch7视觉里程计1/点云关键点与特征描述子.md
      #     - 第8讲-视觉里程计2:
          - 第9讲-后端1:
                - 学习笔记/ch9后端1/概述.md
    - 代码实践:
          - 运行环境配置: practice/env.md
    - 课后习题:
          - ch03-三维空间刚体运动: 课后习题/ch03-三维空间刚体运动.md
          - ch04-李群与李代数: 课后习题/ch04-李群与李代数.md
          - ch05-相机与图像: 课后习题/ch05-相机与图像.md
          - ch06-非线性优化: 课后习题/ch06-非线性优化.md
          - ch07-视觉里程计1: 课后习题/ch07-视觉里程计1.md
    - 其他:
          - 矩阵分解: 其他/矩阵分解.md
          - 矩阵相似变换的意义: 其他/矩阵相似变换的意义.md


# 右上角展示GitHub仓库
repo_url: https://github.com/Gongzihang6/slambook2
repo_name: Gongzihang6/slambook2
edit_uri: edit/master/docs/ # 允许读者点击编辑按钮跳转到源码

# 插件配置
plugins:
    - caption     # 显示图片题注
    - callouts    # 让mkdocs识别>[!note]语法
    - search
    - git-revision-date-localized:
            type: date
            enable_creation_date: true
    - glightbox:
            touchNavigation: true
            loop: false
            effect: zoom # zoom, fade, etc.
            width: 100%
            height: auto
            zoomable: true
            draggable: true
extra:
    # analytics:
    #   provider: google # ...你的谷歌分析配置

    # 评论系统配置
    comments:
        provider: giscus
        repo: Gongzihang6/slambook2
        repo_id: R_kgDOQccb4Q # 从你截图里提取的 data-repo-id
        category: General # 从你截图里提取的 data-category
        category_id: DIC_kwDOQccb4c4Cz-Dd # 从你截图里提取的 data-category-id
        mapping: pathname # 对应 data-mapping="pathname"
        reactions_enabled: true # 对应 data-reactions-enabled="1"
        emit_metadata: false
        input_position: top # 对应 input-position="top"，评论框在评论列表上方
        lang: zh-CN # 对应 data-lang="zh-CN"
        # theme: preferred_color_scheme # 主题会自动跟随网站的日间/夜间模式，不用手动设

# 注册自定义 CSS 文件
extra_css:
    - stylesheets/extra.css
copyright: Copyright &copy; 2025 Gongzihang6
