# mkdocs.yml
site_name: 视觉SLAM十四讲学习笔记
site_url: https://Gongzihang6.github.io/slambook2/
site_author: Gongzihang6

# 主题设置
theme:
  name: material
  language: zh # 中文界面
  features:
    - navigation.tabs # 顶部导航栏
    - navigation.sections # 侧边栏分组
    - navigation.expand # 默认展开侧边栏
    - navigation.top # 返回顶部按钮
    - search.suggest # 搜索建议
    - search.highlight # 搜索高亮

# 必要的扩展 (支持数学公式和更丰富的 Markdown 语法)
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true

# 数学公式渲染引擎 (MathJax)
extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# 目录结构 (你可以根据自己的笔记慢慢添加)
nav:
  - 首页: index.md
  - 基础知识:
      - 第2讲-初识SLAM: ch2/README.md
      - 第3讲-三维空间刚体运动: ch3/README.md
  - 代码实践:
      - 运行环境配置: practice/env.md
